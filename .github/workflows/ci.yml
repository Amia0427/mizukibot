name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CI: 'true'
  AGENT_PROMPT_EXTRA_ROOTS: ''
  DATA_DIR: ${{ runner.temp }}/mizuki-data
  MIZUKIBOT_ENV_FILE: ${{ runner.temp }}/mizukibot-ci.env

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js version
        run: npm run check:node

      - name: Lint
        run: npm run lint

      - name: Typecheck stable boundaries
        run: npm run typecheck

      - name: Check prompts
        run: npm run check:prompts

      - name: Check tracked secrets
        run: npm run check:secrets:all

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run versioned harness eval
        run: npm run eval:harness:ci

      - name: Run coverage gate
        shell: pwsh
        run: |
          npm run coverage 2>&1 | Tee-Object -FilePath coverage-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failed coverage log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-output-${{ github.run_id }}
          path: coverage-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            artifacts/coverage/coverage-summary.json
            artifacts/coverage/baseline-check.json
            artifacts/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  linux-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Check Node.js version and Linux scripts
        run: |
          node scripts/check-node-version.js
          bash -n scripts/bootstrap-debian12.sh scripts/install-linux.sh scripts/check-linux.sh

      - name: Check repository policies
        run: node scripts/run-tests.js tests/nodeVersionPolicy.test.js tests/ciWorkflow.test.js tests/checkSecretsAllMode.test.js
